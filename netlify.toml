# Netlify configuration for Repeto Web App & Play Console landing endpoints
[build]
  command = "npm run build:web"
  publish = "dist"

# Pure static legal and compliance pages (force = true ensures no Expo Router JS interception)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms-of-service"
  to = "/terms.html"
  status = 200
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms.html"
  status = 200
  force = true

[[redirects]]
  from = "/delete-account"
  to = "/account-deletion.html"
  status = 200
  force = true

[[redirects]]
  from = "/account-deletion"
  to = "/account-deletion.html"
  status = 200
  force = true

[[redirects]]
  from = "/account-deletion.html"
  to = "/account-deletion.html"
  status = 200
  force = true

# Expo Router Client-Side Routing Fallback (SPA) for the Web App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
